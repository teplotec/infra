name: ERP Image

on:
  pull_request:
    paths:
      - "apps/teplotec_erp/**"
      - "docker/erpnext/**"
      - ".github/workflows/erp-image.yml"
  push:
    branches:
      - main
    paths:
      - "apps/teplotec_erp/**"
      - "docker/erpnext/**"
      - ".github/workflows/erp-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: erp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/teplotec/erpnext
  FRAPPE_DOCKER_VERSION: v3.2.1
  ERPNEXT_VERSION: v16.31.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Prepare Frappe Docker build context
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "$FRAPPE_DOCKER_VERSION" \
            --depth 1 \
            https://github.com/frappe/frappe_docker.git \
            build/frappe_docker

          mkdir -p build/frappe_docker/local-apps
          cp -a apps/teplotec_erp build/frappe_docker/local-apps/teplotec_erp
          cp docker/erpnext/Containerfile build/frappe_docker/Containerfile.teplotec

          cat > build/frappe_docker/apps.json <<JSON
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "$ERPNEXT_VERSION"
            },
            {
              "url": "file:///opt/teplotec_erp",
              "branch": "main"
            }
          ]
          JSON

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          args=(
            docker buildx build
            --progress=plain
            --build-arg FRAPPE_BRANCH=version-16
            --secret id=apps_json,src=build/frappe_docker/apps.json
            --file build/frappe_docker/Containerfile.teplotec
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA"
            build/frappe_docker
          )

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--load)
          else
            args+=(--push --tag "$IMAGE_NAME:main")
          fi

          "${args[@]}"

      - name: Verify image metadata
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_NAME:sha-$GITHUB_SHA" >/dev/null

      - name: Start smoke test services
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker network create teplotec-erp-smoke >/dev/null

          docker run -d \
            --name teplotec-erp-smoke-db \
            --network teplotec-erp-smoke \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            mariadb:11.8 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci >/dev/null

          docker run -d \
            --name teplotec-erp-smoke-redis \
            --network teplotec-erp-smoke \
            redis:6.2-alpine >/dev/null

          for attempt in {1..60}; do
            if docker exec teplotec-erp-smoke-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs teplotec-erp-smoke-db
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if docker exec teplotec-erp-smoke-redis redis-cli ping | grep -q PONG; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs teplotec-erp-smoke-redis
              exit 1
            fi
            sleep 1
          done

          docker run -d \
            --name teplotec-erp-smoke-backend \
            --network teplotec-erp-smoke \
            --entrypoint bash \
            "$IMAGE_NAME:sha-$GITHUB_SHA" \
            -lc 'while true; do sleep 3600; done' >/dev/null

      - name: Configure smoke test bench
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          backend="teplotec-erp-smoke-backend"

          docker exec "$backend" bench set-config -g db_host teplotec-erp-smoke-db
          docker exec "$backend" bench set-config -gp db_port 3306
          docker exec "$backend" bench set-config -g redis_cache redis://teplotec-erp-smoke-redis:6379
          docker exec "$backend" bench set-config -g redis_queue redis://teplotec-erp-smoke-redis:6379
          docker exec "$backend" bench set-config -g redis_socketio redis://teplotec-erp-smoke-redis:6379

      - name: Create fresh ERPNext site
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker exec teplotec-erp-smoke-backend \
            bench new-site ci.localhost \
            --no-mariadb-socket \
            --db-root-username root \
            --db-root-password ci-root-password \
            --admin-password ci-admin-password \
            --mariadb-user-host-login-scope='%' \
            --install-app erpnext

      - name: Install TeploTEC ERP app
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker exec teplotec-erp-smoke-backend \
            bench --site ci.localhost install-app teplotec_erp

      - name: Migrate smoke test site
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker exec teplotec-erp-smoke-backend \
            bench --site ci.localhost migrate

      - name: Verify TeploTEC localization
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker exec teplotec-erp-smoke-backend \
            bench --site ci.localhost list-apps | grep -q teplotec_erp

          docker exec teplotec-erp-smoke-backend \
            bench --site ci.localhost execute teplotec_erp.diagnostics.verify_localization

      - name: Cleanup smoke test
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          docker rm -f \
            teplotec-erp-smoke-backend \
            teplotec-erp-smoke-db \
            teplotec-erp-smoke-redis >/dev/null 2>&1 || true
          docker network rm teplotec-erp-smoke >/dev/null 2>&1 || true
