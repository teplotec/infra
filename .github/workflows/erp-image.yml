name: ERP Image

on:
  pull_request:
    paths:
      - "apps/teplotec_erp/**"
      - "docker/erpnext/**"
      - ".github/workflows/erp-image.yml"
  push:
    branches:
      - main
    paths:
      - "apps/teplotec_erp/**"
      - "docker/erpnext/**"
      - ".github/workflows/erp-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: erp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/teplotec/erpnext
  FRAPPE_DOCKER_VERSION: v3.2.1
  ERPNEXT_VERSION: v16.31.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Prepare Frappe Docker build context
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "$FRAPPE_DOCKER_VERSION" \
            --depth 1 \
            https://github.com/frappe/frappe_docker.git \
            build/frappe_docker

          mkdir -p build/frappe_docker/local-apps
          cp -a apps/teplotec_erp build/frappe_docker/local-apps/teplotec_erp
          cp docker/erpnext/Containerfile build/frappe_docker/Containerfile.teplotec

          cat > build/frappe_docker/apps.json <<JSON
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "$ERPNEXT_VERSION"
            },
            {
              "url": "file:///opt/teplotec_erp",
              "branch": "main"
            }
          ]
          JSON

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          args=(
            docker buildx build
            --progress=plain
            --build-arg FRAPPE_BRANCH=version-16
            --secret id=apps_json,src=build/frappe_docker/apps.json
            --file build/frappe_docker/Containerfile.teplotec
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA"
            build/frappe_docker
          )

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--load)
          else
            args+=(--push --tag "$IMAGE_NAME:main")
          fi

          "${args[@]}"

      - name: Verify image metadata
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_NAME:sha-$GITHUB_SHA" >/dev/null

      - name: Smoke test fresh ERPNext site
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          network="teplotec-erp-smoke"
          mariadb="teplotec-erp-smoke-db"
          redis="teplotec-erp-smoke-redis"

          cleanup() {
            docker rm -f "$mariadb" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null

          docker run -d \
            --name "$mariadb" \
            --network "$network" \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            mariadb:10.11 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci >/dev/null

          docker run -d \
            --name "$redis" \
            --network "$network" \
            redis:7-alpine >/dev/null

          for attempt in {1..60}; do
            if docker exec "$mariadb" healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$mariadb"
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if docker exec "$redis" redis-cli ping | grep -q PONG; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$redis"
              exit 1
            fi
            sleep 1
          done

          docker run --rm \
            --network "$network" \
            --entrypoint bash \
            "$IMAGE_NAME:sha-$GITHUB_SHA" \
            -lc '
              set -euo pipefail
              bench set-config -g db_host teplotec-erp-smoke-db
              bench set-config -gp db_port 3306
              bench set-config -g redis_cache redis://teplotec-erp-smoke-redis:6379
              bench set-config -g redis_queue redis://teplotec-erp-smoke-redis:6379
              bench set-config -g redis_socketio redis://teplotec-erp-smoke-redis:6379
              bench new-site ci.localhost \
                --no-mariadb-socket \
                --db-root-username root \
                --db-root-password ci-root-password \
                --admin-password ci-admin-password \
                --install-app erpnext
              bench --site ci.localhost install-app teplotec_erp
              bench --site ci.localhost migrate
              bench --site ci.localhost list-apps | grep -q teplotec_erp
              bench --site ci.localhost execute teplotec_erp.diagnostics.verify_localization
            '
