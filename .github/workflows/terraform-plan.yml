name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      ACCESS_ALLOWED_EMAILS_JSON: ${{ vars.ACCESS_ALLOWED_EMAILS_JSON }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init for validation
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Check plan configuration
        id: plan_config
        shell: bash
        run: |
          if [[ -n "$HCLOUD_TOKEN" \
             && -n "$CLOUDFLARE_API_TOKEN" \
             && -n "$AWS_ACCESS_KEY_ID" \
             && -n "$AWS_SECRET_ACCESS_KEY" \
             && -n "$TF_STATE_BUCKET" \
             && -n "$CLOUDFLARE_ACCOUNT_ID" \
             && -n "$CLOUDFLARE_ZONE_ID" \
             && -n "$ACCESS_ALLOWED_EMAILS_JSON" \
             && -n "$SSH_PUBLIC_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write R2 backend config
        if: steps.plan_config.outputs.ready == 'true'
        shell: bash
        run: |
          cat > /tmp/backend.hcl <<BACKEND
          bucket = "$TF_STATE_BUCKET"
          key    = "erp/production/terraform.tfstate"
          region = "auto"

          endpoints = {
            s3 = "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          }

          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          use_lockfile                = true
          BACKEND

      - name: Terraform init with R2 backend
        if: steps.plan_config.outputs.ready == 'true'
        run: terraform init -reconfigure -backend-config=/tmp/backend.hcl

      - name: Terraform plan
        if: steps.plan_config.outputs.ready == 'true'
        env:
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_access_allowed_emails: ${{ vars.ACCESS_ALLOWED_EMAILS_JSON }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -no-color

      - name: Plan not run yet
        if: steps.plan_config.outputs.ready != 'true'
        run: echo "Terraform syntax and provider schemas validated. Add the documented repository secrets and variables to enable terraform plan."
