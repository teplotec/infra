name: ERP Config Check

on:
  pull_request:
    paths:
      - "config/erp-setup.json"
      - "scripts/erp-admin"
      - "scripts/install-github-runner"
      - "ansible/**"
      - "apps/teplotec_erp/**"
      - ".github/workflows/erp-reset.yml"
      - ".github/workflows/erp-pilot.yml"
      - ".github/workflows/erp-config-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate admin scripts
        run: |
          bash -n scripts/erp-admin
          bash -n scripts/install-github-runner

      - name: Validate setup profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/erp-setup.json >/dev/null
          python3 - <<'PY'
          import json

          with open("config/erp-setup.json", encoding="utf-8") as handle:
              config = json.load(handle)

          expected = {
              "language": "Українська",
              "country": "Ukraine",
              "timezone": "Europe/Kyiv",
              "currency": "UAH",
              "company_name": "TEPLOTEC",
              "company_abbr": "TEC",
              "setup_demo": 0,
              "enable_telemetry": 0,
          }

          mismatches = {
              key: {"expected": value, "actual": config.get(key)}
              for key, value in expected.items()
              if config.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"Invalid TEPLOTEC ERP setup profile: {mismatches}")
          PY

      - name: Validate Ansible host configuration
        run: |
          python3 -m pip install --disable-pip-version-check ansible-core
          ansible-playbook --syntax-check ansible/playbooks/erp-host.yml

      - name: Compile TEPLOTEC ERP Python
        run: python3 -m compileall -q apps/teplotec_erp/teplotec_erp
