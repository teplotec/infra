name: ERP / CI / 01 Validate Configuration

on:
  pull_request:
    paths:
      - "config/erp-setup.json"
      - "scripts/erp-admin"
      - "scripts/groundloop-api-admin"
      - "scripts/install-github-runner"
      - "scripts/host-preflight-audit"
      - "ansible/**"
      - "apps/teplotec_erp/**"
      - "docker/erpnext/**"
      - ".github/workflows/groundloop-api-deploy.yml"
      - ".github/workflows/erp-reset.yml"
      - ".github/workflows/erp-pilot.yml"
      - ".github/workflows/erp-config-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate admin scripts
        run: |
          bash -n scripts/erp-admin
          bash -n scripts/groundloop-api-admin
          bash -n scripts/install-github-runner
          bash -n scripts/host-preflight-audit

      - name: Validate setup profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/erp-setup.json >/dev/null
          python3 - <<'PY'
          import json

          with open("config/erp-setup.json", encoding="utf-8") as handle:
              config = json.load(handle)

          expected = {
              "language": "Українська",
              "country": "Ukraine",
              "timezone": "Europe/Kyiv",
              "currency": "UAH",
              "company_name": "TEPLOTEC",
              "company_abbr": "TEC",
              "setup_demo": 0,
              "enable_telemetry": 0,
          }

          mismatches = {
              key: {"expected": value, "actual": config.get(key)}
              for key, value in expected.items()
              if config.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"Invalid TEPLOTEC ERP setup profile: {mismatches}")
          PY

      - name: Validate Ansible host configuration
        run: |
          python3 -m pip install --disable-pip-version-check ansible-core
          ansible-playbook --syntax-check ansible/playbooks/app-host.yml

      - name: Compile TEPLOTEC ERP Python
        run: python3 -m compileall -q apps/teplotec_erp/teplotec_erp

      - name: Validate Ukrainian Frappe CRM overlay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext >/dev/null

          po="apps/teplotec_erp/teplotec_erp/crm_locale/uk.po"
          msgfmt --check --check-header -o /dev/null "$po"

          python3 - <<'PY'
          import re
          from pathlib import Path

          po_path = Path("apps/teplotec_erp/teplotec_erp/crm_locale/uk.po")
          workflow_path = Path(".github/workflows/erp-image.yml")
          po = po_path.read_text(encoding="utf-8")
          workflow = workflow_path.read_text(encoding="utf-8")

          version_match = re.search(r"FRAPPE_CRM_VERSION:\s*(\S+)", workflow)
          if not version_match:
              raise SystemExit("FRAPPE_CRM_VERSION is missing from ERP Image workflow")

          version = version_match.group(1)
          marker = f"X-TEPLOTEC-Upstream-CRM-Version: {version}\\n"
          if marker not in po:
              raise SystemExit(
                  f"CRM Ukrainian overlay is not aligned with pinned Frappe CRM {version}"
              )

          reviewed = len(re.findall(r'^msgstr ".+"$', po, flags=re.MULTILINE))
          if reviewed < 50:
              raise SystemExit(f"Expected at least 50 reviewed CRM translations, found {reviewed}")

          print(f"Reviewed Ukrainian Frappe CRM strings: {reviewed}")
          PY
